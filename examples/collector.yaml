# Sample OpenTelemetry Collector config for trying OTTL Lens.
#  • Linting: the transform/lint-demo + filter blocks contain intentional mistakes
#    that should get squiggles.
#  • Dry-run: put your cursor inside the transform/logs block below (valid statements)
#    and run "OTTL: Dry Run" → pick Logs → Run to see the transformed output.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # --- transform: valid statements — put your cursor here and run "OTTL: Dry Run" ---
  transform/logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(log.attributes["env"], "production")
          - set(log.attributes["env.upper"], ConvertCase(log.attributes["env"], "upper"))
          # ↓ runs fine, but changes nothing — "env" is already "production"
          - set(log.attributes["env"], "production")
          # ↓ the statement is valid, but its guard matches no record in the sample payload
          - set(log.attributes["tier"], "gold") where log.attributes["plan"] == "enterprise"
          # ↓ silently drops "environment" — watch the removed line in the diff
          - keep_keys(log.attributes, ["env", "env.upper", "http.method"])

  # --- transform: behaviour that depends on the collector version ---
  #     Dry-run it, then pick an older version under "Compare with" (e.g. v0.157.0)
  #     to see what changes when you upgrade.
  transform/upgrade-check:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          # ↓ "team" isn't in the sample: nothing happens up to v0.160; from v0.161 "owner" is written as an empty value
          - set(log.attributes["owner"], log.attributes["team"])
          # ↓ the body isn't a number: Int() returns nil up to v0.159; from v0.160 it's a runtime error
          - set(log.attributes["status"], Int(log.body))

  # --- transform: intentional mistakes — for the linter (do not dry-run) ---
  transform/lint-demo:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(log.attributes["parsed"], ParseJson(body))   # WARN: unknown fn (did you mean ParseJSON?)
          - set(log.attributes["bad"] = "x")                 # ERROR: single '='
          - keep_keys(log.attributes, ["a", "b")             # ERROR: unbalanced ] vs )
          - set(log.body, "x") where log.severity_number == "9"   # WARN: can never match (int64 vs string) — quick fix: 9
          - keep_keys(log.attributes, "http.method")         # ERROR: keep_keys needs a list — quick fix: ["http.method"]

  # --- filter: new style ---
  filter/drop-noise:
    error_mode: ignore
    log_conditions:
      - IsMatch(log.body, ".*healthcheck.*")                # ok
      - not_a_function(log.body)                            # WARN: unknown function
      - IsMatch(log.body, ".*oops                          # ERROR: unterminated string

exporters:
  debug: {}

connectors:
  routing:
    default_pipelines: [logs/all]
    table:
      - context: resource
        statement: route where attributes["tenant"] == "acme"   # ok (route() is valid here)
        pipelines: [logs/acme]

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [transform/logs, filter/drop-noise]
      exporters: [debug]
